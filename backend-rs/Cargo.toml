[package]
name = "fresnel-2"
version = "0.1.0"
edition = "2024"

[dependencies]
derive-getters = "0.5.0"
image = "0.25.10"
rocket = "0.5.1"
aws-config = { version= "1.8.16", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-s3 = "1.111.0"
tokio = { version = "1", features = ["full"] }
typed-path = "0.12"
test-temp-dir = "0.7.0"
strum = "0.28.0"
strum_macros = "0.28"
derive-new = "0.7.0"
scopeguard = "1.2.0"
openjpeg-sys = "1.0.12"


[dev-dependencies]
aws-smithy-mocks = "0.2.6"
aws-sdk-s3 = { version = "1", features = ["test-util"] }

[profile.dev]
debug = true
