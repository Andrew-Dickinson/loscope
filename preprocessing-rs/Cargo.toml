[package]
name = "loscope-preprocessing"
version = "0.1.0"
edition = "2024"

[dependencies]
loscope = { path = "../backend-rs" }
ndarray = "0.17.2"
clap = { version = "4", features = ["derive"] }
las = "0.9"
tiff = "0.11.3"
geo = "0.33.1"
wkt = "0.14.0"
indicatif = "0.17"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["blocking", "json", "gzip"] }
csv = "1"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
chrono = "0.4"
shapefile = "0.8.0"
geojson = { version = "1", features = ["geo-types"] }

[dev-dependencies]
tempfile = "3"