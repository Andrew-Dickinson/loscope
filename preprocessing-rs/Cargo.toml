[package]
name = "loscope-preprocessing"
version = "0.1.0"
edition = "2024"

[dependencies]
loscope = { path = "../backend-rs" }
clap = { version = "4", features = ["derive"] }
geo = "0.33.1"
wkt = "0.14.0"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"

[profile.dev]
debug = true
