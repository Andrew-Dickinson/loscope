[package]
name = "loscope-preprocessing"
version = "0.1.0"
edition = "2024"

[dependencies]
loscope = { path = "../backend-rs" }
ndarray = "0.17.2"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
las = "0.9"
tiff = "0.11.3"
geo = "0.33.1"
wkt = "0.14.0"
indicatif = "0.17"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = true
